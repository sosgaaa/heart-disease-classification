name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Evaluate all three models
        run: |
          python main.py --method knn --cv-folds 5
          python main.py --method kmeans --cv-folds 5
          python main.py --method logistic_regression --cv-folds 5
      - name: Reproduce nested evaluation
        run: python evaluate.py --output /tmp/evaluation.json
      - name: Verify report tables and plots
        run: python scripts/sync_report.py --check
